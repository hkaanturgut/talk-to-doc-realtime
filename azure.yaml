# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: talk-to-doc-realtime
metadata:
  template: talk-to-doc-realtime@0.1.0
infra:
  provider: bicep
  path: infra
services:
  web:
    project: .
    language: ts
    host: containerapp
    docker:
      path: Dockerfile
      remoteBuild: true
      buildArgs:
        - GIT_SHA=${GIT_SHA=dev}
